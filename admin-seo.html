<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO Control Center | Pheline's Haven</title><meta name="robots" content="noindex,nofollow"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;background:#faf8fb;color:#241b27;margin:0;padding:24px}main{max-width:1100px;margin:auto}h1{color:#26003f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e6dce9;border-radius:14px;padding:18px}.big{font-size:28px;font-weight:700;color:#26003f}.issue{border-left:5px solid #d66;padding:12px;margin:8px 0;background:#fff}.ok{border-left-color:#4a9}.muted{color:#756a78}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head>
<body><main><h1>SEO Control Center</h1><p class="muted">Monitor product SEO, crawl readiness, sitemap coverage and indexing queue.</p><div id="stats" class="grid"></div><section class="card"><h2>SEO audit</h2><button onclick="audit()">Run product audit</button><div id="issues"></div></section><section class="card"><h2>Google crawl queue</h2><button onclick="queueAll()">Queue active product URLs</button><div id="queue"></div></section></main>
<script>
const U="https://fuckvbsuhjdknguutnxc.supabase.co";const K="sb_publishable_xnx5yh1HPcxZlCMF86d2Ow_v-B49rj8";const sb=window.supabase.createClient(U,K);
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){document.body.innerHTML="<main><h1>Administrator sign-in required.</h1></main>";return}loadStats()}
async function loadStats(){const [a,b,c]=await Promise.all([sb.from("products").select("id",{count:"exact",head:true}).eq("is_active",true),sb.from("products").select("id",{count:"exact",head:true}).eq("is_active",true).not("seo_title","is",null).not("seo_description","is",null),sb.from("indexing_queue").select("id,status,url").order("created_at",{ascending:false}).limit(20)]);stats.innerHTML=[["Active products",a.count||0],["SEO fields complete",b.count||0],["Queued URLs",(c.data||[]).filter(x=>x.status==="pending").length],["Submitted",(c.data||[]).filter(x=>x.status==="submitted").length]].map(x=>`<div class="card"><div class="big">${x[1]}</div><div>${x[0]}</div></div>`).join("");queue.innerHTML=(c.data||[]).map(x=>`<div>${x.status} — ${x.url}</div>`).join("")}
async function audit(){const {data,error}=await sb.from("products").select("name,slug,description,seo_title,seo_description,product_images(storage_path)").eq("is_active",true).limit(500);if(error){issues.textContent=error.message;return}const out=[];for(const p of data||[]){if(!p.description||p.description.length<180)out.push(["warning",p.name,"Description is thin; expand benefits, use, size and relevant buying information."]);if(!p.seo_description||p.seo_description.length<90)out.push(["warning",p.name,"SEO description is too short or missing."]);if(!p.seo_title)out.push(["critical",p.name,"Missing SEO title."]);if(!(p.product_images||[]).length)out.push(["critical",p.name,"No product image."]);}issues.innerHTML=out.slice(0,100).map(x=>`<div class="issue"><b>${x[0].toUpperCase()}</b> — ${x[1]}<br>${x[2]}</div>`).join("")||"<div class='issue ok'>No basic product SEO issues found.</div>"}
async function queueAll(){const {data,error}=await sb.from("products").select("slug").eq("is_active",true);if(error){queue.textContent=error.message;return}const rows=(data||[]).map(p=>({url:"https://phelineshaven.co.ke/product.html?product="+p.slug,action:"URL_UPDATED"}));const r=await sb.from("indexing_queue").upsert(rows,{onConflict:"url,action"});queue.textContent=r.error?r.error.message:"Queued "+rows.length+" URLs for indexing notifications.";loadStats()}
init();
</script></body></html>
