<div class="top">PHELINE'S HAVEN · HAVEN JOURNAL · KENYA</div>
<header class="wrap head"><span class="eyebrow">The Haven Journal</span><h1>Style. Beauty. Life.</h1><p>Useful, people-first guides from Pheline's Haven — made for the way women, men and families shop, dress and care in Kenya.</p></header>
<main class="wrap"><section class="grid" id="posts"></section><article class="article" id="article"></article></main>
<footer class="foot">© 2026 Pheline's Haven · <a href="index.html">Back to shop</a></footer>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const db=createClient("https://fuckvbsuhjdknguutnxc.supabase.co","sb_publishable_xnx5yh1HPcxZlCMF86d2Ow_v-B49rj8");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const slug=new URLSearchParams(location.search).get("slug");
const {data,error}=await db.from("blog_posts").select("*").eq("is_published",true).order("published_at",{ascending:false});
const posts=data||[];
const oldList=document.getElementById("journal-schema");if(oldList)oldList.remove();const listLd=document.createElement("script");listLd.id="journal-schema";listLd.type="application/ld+json";listLd.textContent=JSON.stringify({"@context":"https://schema.org","@type":"ItemList","itemListElement":posts.map((p,i)=>({"@type":"ListItem","position":i+1,"url":"https://phelineshaven.co.ke/blog-post.html?slug="+encodeURIComponent(p.slug),"name":p.title}))});document.head.appendChild(listLd);
function show(p){document.title=(p.seo_title||p.title)+" | Pheline's Haven"; document.querySelector('link[rel=canonical]').href="https://phelineshaven.co.ke/blog-post.html?slug="+encodeURIComponent(p.slug);document.getElementById("posts").style.display="none";const a=document.getElementById("article");a.style.display="block";a.innerHTML='<a class="back" href="blog.html">← All journal posts</a><img src="'+esc(p.cover_image_url)+'" alt="'+esc(p.title)+'"><span class="eyebrow">'+esc(p.author_name)+'</span><h2>'+esc(p.title)+'</h2><p style="color:#776c7b;font-size:11px">'+esc(p.excerpt)+'</p><div class="content">'+esc(p.content).split(/\n+/).map(x=>"<p>"+x+"</p>").join("")+'</div>';history.replaceState({},'',"?slug="+encodeURIComponent(p.slug));}
if(error) document.getElementById("posts").innerHTML="<p>Journal temporarily unavailable.</p>";
else if(slug){const p=posts.find(x=>x.slug===slug);p?show(p):document.getElementById("posts").innerHTML="<p>Article not found.</p>";}
else document.getElementById("posts").innerHTML=posts.map(p=>'<article class="card"><img loading="lazy" src="'+esc(p.cover_image_url)+'" alt="'+esc(p.title)+'"><div class="card-body"><small>Haven Journal</small><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt)+'</p><a class="read" href="blog-post.html?slug='+encodeURIComponent(p.slug)+'">Read the guide →</a></div></article>').join("");
</script></body></html>
