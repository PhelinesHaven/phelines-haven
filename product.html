const slug=new URLSearchParams(location.search).get("product");

function renderProduct(p){
 const stock=Number(p.stock||0), threshold=Number(p.low_stock_threshold??20);
 const stockText=stock===0?"OUT OF STOCK":stock<=threshold?"Only "+stock+" left":"In stock";
 document.title=esc(p.name)+" | Pheline's Haven";
 const productUrl=location.origin+location.pathname+"?product="+encodeURIComponent(p.slug);
 const inquiry="Hello Pheline's Haven! I'd like to enquire about this product:\n\nProduct: "+p.name+"\nCategory: "+p.category+"\nBrand: "+(p.brand||"Pheline's Haven")+"\nPrice: "+money(p.price)+"\nAvailability: "+stockText+"\nSKU: "+(p.sku||"Not listed")+"\nDescription: "+(p.description||"Not provided")+"\n\nProduct link: "+productUrl+"\n\nPlease confirm availability, delivery options and how I can pay.";
 const desc=String(p.description||"");
 const lines=desc.split(/\\n|\\r|\n|\r/).map(x=>x.trim()).filter(Boolean);
 const notice=lines.find(x=>/Color Substitution Notice/i.test(x))||"";
 const core=lines.filter(x=>x!==notice);
 const facts=[];
 const sizeMatch=desc.match(/(?:SIZE|SIZES?)\\s+([A-Z0-9 ,&-]+?)(?:\\.|$)/i); if(sizeMatch) facts.push("<strong>Sizes:</strong> "+esc(sizeMatch[1]));
 const rangeMatch=desc.match(/(?:Size|sizes)\\s*([0-9]+(?:-[0-9]+)?)/i); if(rangeMatch && !sizeMatch) facts.push("<strong>Sizes:</strong> "+esc(rangeMatch[1]));
 const colourMatch=desc.match(/(?:different colours|multiple colour variants|multiple solid colours|multiple prints|colour options|color options|colour variants|shade is unavailable|colours?\\.)/i); if(colourMatch) facts.push("<strong>Colour options:</strong> See available variants in the supplier description.");
 const materialMatch=desc.match(/(?:Cotton|Satin|Silk|canvas|material|rubber|gold foil|floral|peplum)/i); if(materialMatch) facts.push("<strong>Material/style:</strong> "+esc(materialMatch[0]));
 const sourceBlock=p.source_url?'<p><strong>Supplier listing:</strong> <a href="'+esc(p.source_url)+'" target="_blank" rel="noopener" style="color:var(--purple);text-decoration:underline">View original product listing</a></p>':"";
 const detailHtml=core.map(x=>"<p>"+esc(x)+"</p>").join("")||"<p>Product information supplied by the wholesaler.</p>";
 const noticeText=notice.replace(/^Color Substitution Notice:\\s*/i,"").replace(/^Colour Substitution Notice:\\s*/i,"").trim();
 const noticeHtml=notice?'<div class="color-note"><strong>Color Substitution Notice</strong><br>'+esc(noticeText)+'</div>':"";
 const colorCount=(desc.match(/(?:comes in|it comes in)\\s+(\\d+)\\s+colou?rs?/i)||[])[1];
 const colorLine=colorCount?'<p class="color-note">It comes in '+esc(colorCount)+' colors</p>':( /(?:different colours|different colors|multiple solid colours|multiple colour variants|colour options|color options)/i.test(desc)?'<p class="color-note">It comes in multiple colors</p>':"");
 const variantLines=lines.filter(x=>/^SELECT VARIANT:/i.test(x)||/\\s\/\\s/.test(x));
 const variantText=variantLines.join(" ");
 const variantHtml=variantText?'<label class="variant-label" for="variant">SELECT VARIANT: Choose a combination</label><select class="variant-select" id="variant"><option value="">Choose a combination</option>'+variantText.replace(/^SELECT VARIANT:\\s*Choose a combination\\s*/i,"").split(/\\s+(?=[A-Z][^\\n]*\\s\/\\s)/).map(v=>'<option>'+esc(v)+'</option>').join("")+'</select>':"";
 const qtyHtml=stock>0?'<div class="qty-row"><label for="qty" class="variant-label" style="margin:0">Quantity</label><input id="qty" type="number" min="1" max="'+stock+'" value="1"></div>':"";
 const actionHtml=stock>0?'<div class="buy-row"><button class="cart-btn" id="addCart">Add to Cart</button><button class="buy-btn" id="buyNow">Buy Now</button></div><a class="whatsapp" href="https://wa.me/254116400947?text='+encodeURIComponent(inquiry)+'" target="_blank" rel="noopener">💬 WHATSAPP PRODUCT INQUIRY →</a><p class="inquiry-note">Tap WhatsApp and the product details are already filled in.</p>':'<span class="btn" style="opacity:.5;pointer-events:none">OUT OF STOCK</span>';
 const relatedHtml='<div class="reviews"><h3>Customer Reviews</h3><p><strong>Sign in</strong> to write a review.</p><p>No reviews yet. Be the first to review this product!</p></div><div class="related"><h3>Related Products</h3><p><a href="collection.html?cat='+encodeURIComponent(p.category||"")+'" style="color:var(--purple);font-weight:700;text-decoration:underline">View All</a></p></div>';
 app.innerHTML='<section class="product"><div class="image">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'<div>No product image available</div>')+'</div><div><div class="cat">'+esc(p.category)+'</div><h1 class="name">'+esc(p.name)+'</h1><p class="desc">'+esc(core.join(" "))+'</p><div class="price">'+money(p.price)+(p.compare_at_price&&Number(p.compare_at_price)!==Number(p.price)?'<span class="old">'+money(p.compare_at_price)+'</span>':"")+'</div>'+noticeHtml+'<div class="stock">'+esc(stock>0?("In Stock ("+stock+" available)"):stockText)+'</div>'+colorLine+variantHtml+qtyHtml+actionHtml+'<div class="trust"><div><strong>Kenya delivery</strong><span>Nationwide options</span></div><div><strong>M-Pesa & cards</strong><span>Easy payment</span></div><div><strong>WhatsApp help</strong><span>Fast product support</span></div></div><div class="details"><details open><summary>Full product description</summary>'+detailHtml+factsHtml+sourceBlock+'</details><details><summary>Product information</summary><p><strong>SKU:</strong> '+esc(p.sku||"Not listed")+'<br><strong>Brand:</strong> '+esc(p.brand||"Pheline's Haven")+'<br><strong>Price:</strong> '+money(p.price)+'<br><strong>Availability:</strong> '+esc(stockText)+'</p></details><details><summary>Delivery & returns</summary><p>Delivery is available across Kenya. Confirm the delivery fee, timing and return options with us before payment.</p></details><details><summary>Need help?</summary><p>Use the WhatsApp button above and the product information will already be included in your message.</p></details></div>'+relatedHtml+'</div></section>';

 document.getElementById("buyNow")?.addEventListener("click",()=>{const q=Number(document.getElementById("qty")?.value||1);const v=document.getElementById("variant")?.value||"";location.href="https://wa.me/254116400947?text="+encodeURIComponent("Hello Pheline's Haven! I want to buy "+p.name+" | Quantity: "+q+" | Variant: "+v+" | Price: "+money(p.price));});

async function fallbackLoad(){
 try{
  const headers={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY};
  const pr=await fetch(SUPABASE_URL+"/rest/v1/products?select=id,name,slug,description,brand,sku,price,compare_at_price,stock_quantity,low_stock_threshold,category_id&slug=eq."+encodeURIComponent(slug)+"&is_active=eq.true&limit=1",{headers});
  if(!pr.ok)throw new Error("Product request failed");
  const rows=await pr.json();
  if(!rows.length){app.innerHTML='<div class="error"><h1>Product not found</h1><p>This product is not currently available.</p><a class="btn" href="/">Back to shop</a></div>';return;}
  const p=rows[0];
  const [cr,ir,vr]=await Promise.all([
   fetch(SUPABASE_URL+"/rest/v1/categories?select=name&id=eq."+encodeURIComponent(p.category_id)+"&limit=1",{headers}),
   fetch(SUPABASE_URL+"/rest/v1/product_images?select=storage_path,sort_order&product_id=eq."+encodeURIComponent(p.id)+"&order=sort_order.asc",{headers}),
   fetch(SUPABASE_URL+"/rest/v1/product_variants?select=name,sku,price,stock_quantity,options,is_active&product_id=eq."+encodeURIComponent(p.id)+"&is_active=eq.true&order=created_at.asc",{headers})
  ]);
  const cats=cr.ok?await cr.json():[], imgs=ir.ok?await ir.json():[], vars=vr.ok?await vr.json():[];
  renderProduct({name:p.name,slug:p.slug,description:p.description,brand:p.brand,sku:p.sku,price:Number(p.price),compare_at_price:p.compare_at_price==null?null:Number(p.compare_at_price),stock:Number(p.stock_quantity||0),low_stock_threshold:Number(p.low_stock_threshold??20),category:cats[0]?.name||"Pheline's Haven",variants:vars,image:imgs[0]?.storage_path&&/^https?:\/\//i.test(imgs[0].storage_path)?imgs[0].storage_path:(imgs[0]?.storage_path?SUPABASE_URL+"/storage/v1/object/public/product-images/"+String(imgs[0].storage_path).replace(/^\/+/, ""):"")});
 }catch(e){app.innerHTML='<div class="error"><h1>Unable to load product</h1><p>Please try again.</p><a class="btn" href="/">Back to shop</a></div>';}
}
if(!slug){app.innerHTML='<div class="error"><h1>Product not specified</h1><a class="btn" href="/">Back to shop</a></div>';}
else {
 const local=STATIC_PRODUCTS.find(p=>p.slug===slug);
 if(local) renderProduct(local);
 else fallbackLoad();
}
